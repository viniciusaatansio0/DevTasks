<!DOCTYPE html>

    <link rel="stylesheet" href="tarefas.css">

<body>
    <header class="header">
        <div class="container header-content">
            <h1 class="logo">DevTasks</h1>

            <nav>
                <a href="index.html" class="active">home</a>

    <main>
        <div class="title">Tarefas</div>
        <form >
            <label for="tarefas">Nova Tarefa:</label>

            <button type="submit" id="Bottom">publicar tarefa</button>

                <div class="checklist">Minhas Tarefas:</div>

            <input type="checkbox" id="EstudarGit">

                <input type="checkbox" id="FazerExercicio">

            <input type="checkbox" id="RevisarPullRequest">
            <label for="RevisarPullRequest">Revisar Pull Request</label>
        </form>
    </main>
